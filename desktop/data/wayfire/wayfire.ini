# Aurora's animated Wayfire session. Managed user copy is regenerated by
# aurora-wayfire-config from Settings and the existing labwc XML preferences.
[core]
plugins = animate autostart command decoration foreign-toplevel grid gtk-shell move place resize switcher vswitch wm-actions window-rules zoom
preferred_decoration_mode = client
vwidth = 4
vheight = 1
close_top_view = <alt> KEY_F4 | <super> KEY_Q

[animate]
open_animation = fade
close_animation = fade
duration = 220ms
zoom_duration = 220ms
fade_duration = 180ms
startup_duration = 300ms

[autostart]
autostart_wf_shell = false
aurora = sh /usr/share/aurora/labwc/autostart

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[grid]
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_c = <super> KEY_UP
restore = <super> KEY_DOWN
slot_tl = <super> <ctrl> KEY_U
slot_tr = <super> <ctrl> KEY_I
slot_bl = <super> <ctrl> KEY_J
slot_br = <super> <ctrl> KEY_K

[wm-actions]
minimize = <super> KEY_M
toggle_fullscreen = <super> KEY_F

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB

[window-rules]
assistant_top = on created if app_id is "org.aurora.Assistant" then set always on top
assistant_sticky = on created if app_id is "org.aurora.Assistant" then set sticky
