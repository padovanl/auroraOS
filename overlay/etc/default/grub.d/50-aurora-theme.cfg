# Aurora's boot menu: the live USB's look (build/stages/50-branding.sh), the
# BIOS variant without the firmware settings row. Read by update-grub.
if [ -d /sys/firmware/efi ]; then
    GRUB_THEME=/usr/share/grub/themes/aurora/theme.txt
else
    GRUB_THEME=/usr/share/grub/themes/aurora/theme-bios.txt
fi
GRUB_GFXMODE=1920x1080,1600x900,1280x720,1024x768,auto
GRUB_TERMINAL_OUTPUT=gfxterm
