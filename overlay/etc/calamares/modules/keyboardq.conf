# Keyboard page: Aurora's own QML (branding/calamares/keyboardq.qml, with
# "Detect…") over the module's built-in one; the job writes the layout to the
# installed system like the classic keyboard module.
---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: true
qmlSearch: both
