---
efiBootLoader: "grub"
kernel: "/vmlinuz"
img: "/initrd.img"
timeout: "5"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
# Debian's signed GRUB expects its configuration under /EFI/debian.
# Keep this vendor directory independent of Aurora's display branding.
efiBootloaderId: "debian"
installEFIFallback: true
