---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"

userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice: file

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
showNotEncryptedBootMessage: true
# Rewritten by aurora-installer for each computer (aurora/installchoice.py):
# erase when every disk is empty, alongside next to another system, none
# otherwise. Never "erase" for every computer: next to Windows, Next would
# wipe it.
initialPartitioningChoice: none

defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs", "ext4", "xfs"]

enableLuksAutomatedPartitioning: true
luksGeneration: luks2

partitionLayout:
    - name: "aurora"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
