---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"

userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice: file

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
showNotEncryptedBootMessage: true
# Never "Erase disk" ready-picked: with Windows or another system on the
# disk, Next would wipe it. "Install alongside" is picked when it is offered
# (another system is there); on an empty disk the person picks Erase disk.
initialPartitioningChoice: alongside

defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs", "ext4", "xfs"]

enableLuksAutomatedPartitioning: true
luksGeneration: luks2

partitionLayout:
    - name: "aurora"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
