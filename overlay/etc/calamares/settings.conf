# Aurora OS installer (Calamares). Based on calamares-settings-debian,
# with Aurora branding and the aurora-finalize job instead of displaymanager.
---
modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - keyboardq
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboardq
  - localecfg
  - users
  - networkcfg
  - hwclock
  - aurora-finalize
  - services-systemd
  - bootloader-config
  - aurora-secureboot
  - grubcfg
  - bootloader
  - aurora-efi-fallback
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - aurora-sources
  - umount
- show:
  - finished

branding: aurora
prompt-install: true
dont-chroot: false
