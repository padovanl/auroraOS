# Aurora OS terminal defaults. Copy to ~/.config/foot/foot.ini to customise.

[main]
font=JetBrains Mono:size=11
pad=14x12 center
initial-window-size-chars=110x30
dpi-aware=no

[scrollback]
lines=20000

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[colors]
alpha=0.94
background=17131f
foreground=e8e3f3
selection-background=3a2f55
selection-foreground=ffffff
# Aurora palette: black red green yellow blue magenta cyan white
regular0=231d30
regular1=ff6f91
regular2=8bd5a0
regular3=ffc46b
regular4=7aa7ff
regular5=a970ff
regular6=6fd6e0
regular7=cfc7dd
bright0=4a4160
bright1=ff8fab
bright2=a6e3b8
bright3=ffd48f
bright4=9dbcff
bright5=c29bff
bright6=94e4ec
bright7=f7f4fc
