# Aurora OS build configuration (sourced by shell scripts)

AURORA_NAME="Aurora OS"
AURORA_ID="aurora"
AURORA_VERSION="0.1"
AURORA_CODENAME="dawn"
AURORA_HOME_URL="https://github.com/aurora-os"

# Upstream base
DEBIAN_SUITE="trixie"
DEBIAN_MIRROR="http://deb.debian.org/debian"
DEBIAN_SECURITY_MIRROR="http://security.debian.org/debian-security"
DEBIAN_COMPONENTS="main contrib non-free-firmware"
ARCH="amd64"

# Live session
LIVE_USER="aurora"
LIVE_HOSTNAME="aurora"

# Default locale / keyboard (overridable at boot: aurora.lang=, aurora.kbd=)
DEFAULT_LOCALE="en_US.UTF-8"
DEFAULT_KEYMAP="us"

# ISO
ISO_LABEL="AURORA_OS"
SQUASHFS_COMP="zstd"
